name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Swift 6.4.2 / ${{ matrix.os }}
    # xcode-27 supplies macOS 27, required by Slate's standard-library APIs.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, xcode-27]
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.4.2"
      - name: Record toolchain
        run: swift --version | tee toolchain.txt
      - name: Debug tests
        run: swift test
      - name: Release tests
        run: swift test -c release
      - name: Allocation checks
        run: Scripts/check-render-allocations.sh
      - name: Rendering benchmark
        run: swift run -c release render-benchmark --iterations 200 --warmup 20 > render-benchmark.json
      - name: Upload benchmark measurements
        uses: actions/upload-artifact@v4
        with:
          name: render-benchmark-${{ matrix.os }}
          path: |
            render-benchmark.json
            toolchain.txt
